# Configuration for human_detector_yolo (YOLO-FastestV2 via NCNN, CPU-only).
# Tuned for a quad Cortex-A53 board (e.g. Orange Pi 3).
#
# The top-level key MUST match the node name ("human_detector_yolo").
human_detector_yolo:
  ros__parameters:

    # --- input -----------------------------------------------------------
    image_topic: /gripper_camera/image_raw/compressed
    queue_size: 1                  # process newest frame only (lowest latency)
    # Cap detection rate (Hz). 0 = run on every incoming frame. 5 = at most
    # 5 Hz; extra frames are dropped before decoding, freeing the CPU.
    max_rate: 5.0

    # Publish the camera frame with detections drawn on it, on
    # 'human_detector/image' (true = on, only while subscribed; false = off).
    publish_debug_image: true

    model_path: ''                 # .bin   (empty = bundled)
    config_path: ''                # .param (empty = bundled)
    num_threads: 1                 # use all 4 A53 cores (leave 1 free if other
                                   # heavy nodes share the board)

    # YOLO-FastestV2 is fully convolutional, so you can shrink its input for
    # speed. Must be a multiple of 32. Measured: 352->224 ~2x, 352->192 ~2.5x.
    ncnn_input_size: 224
    ncnn_fp16: false

    # --- detection -------------------------------------------------------
    # Person boxes are published on detections/humans
    # (vision_msgs/BoundingBox2DArray).
    confidence_threshold: 0.5
